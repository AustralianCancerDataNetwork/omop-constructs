[project]
name = "omop-constructs"
dynamic = ["version"]
description = "For building complex constructs on top of the omop-alchemy library."
readme = "README.md"
authors = [
    { name = "Georgie Kennedy", email = "georgina.kennedy@unsw.edu.au" }
]
requires-python = ">=3.12"
dependencies = [
    "oa-configurator>=1.2.1,<2",
    "omop-alchemy[postgres]>=1.0,<2",
    "omop-semantics>=0.6.0",
    "orm-loader>=1.0,<2",
    "sqlalchemy>=2.0.45",
]

[project.optional-dependencies]
dev = [
    "ipython>=9.8.0",
    # <0.16 deliberately: ruff 0.16 widened its default rule set enormously
    # (omop-alchemy reports 0 findings on 0.15.14 and 607 on 0.16.3). Every
    # sibling is green only because its lockfile predates 0.16. Lifting this
    # bound is a stack-wide decision, not a per-repo one.
    "ruff>=0.15,<0.16",
    "ty==0.0.61",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "tornado>=6.5.5",
    "mkdocs<2.0",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-mermaid2-plugin",
    "mkdocs-table-reader-plugin",
    "mkdocs-macros-plugin",
    "pygments>=2.20.0"
]

[project.scripts]
omop-constructs = "omop_constructs.cli:main"

[project.entry-points."omop.config"]
omop_constructs = "omop_constructs.config:OmopConstructsConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/omop_constructs"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff.lint]
# Ruff 0.16 enables far more rules by default (217 extra findings here). Rather than
# take that wholesale, or ignore it, the high-signal ones are selected explicitly so
# they apply under the pinned <0.16 too.
#
#   B006   mutable default argument  - a real bug class, not a style point
#   PIE810 one startswith/endswith call with a tuple
#
# Deliberately NOT selected, with reasons:
#   RUF012 (42) mutable class attribute -> ClassVar. All 42 are SQLAlchemy declarative
#          hooks (25 __table_args__, 14 __mv_pk__, 3 __mapper_args__), i.e. framework
#          contract, not accidentally-shared instance state. Pure annotation churn.
#   I001   (64) / RUF022 (5) import and __all__ sorting. Cosmetic; adopt as a separate
#          formatting decision if wanted, not smuggled in with a CI migration.
#   UP006/UP007/UP017/UP035/UP045/UP047 (94) annotation modernisation. Mechanical and
#          defensible, but a large diff with no correctness value - its own PR.
#   BLE001 (7) blind `except Exception`. Six are in registry.py diagnostic paths
#          (compile_check, explain, build_plan_json) where catching broadly to report
#          is the intent; enabling it buys seven `# noqa` and no fix.
extend-select = ["B006", "PIE810"]

[tool.ty.rules]
# Staged adoption of `ty` alongside the cava-devops CI. These three account for 97 of
# 98 diagnostics and are suppressed repo-wide so the pipeline can land; they are not a
# statement that the code is clean. Burn down in order: fixing `unresolved-attribute`
# (the dynamic omop-semantics runtime accessors) is what makes the stale mypy-era
# `# type: ignore` comments behind `unused-type-ignore-comment` genuinely removable.
invalid-argument-type = "ignore"
unused-type-ignore-comment = "ignore"
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a configured PostgreSQL database via ENGINE_CDM or ENGINE",
]
