# Findings register
# ---------------------------------------------------------------------------
# `known_violations` on a construct refers to these IDs. OC-* IDs are the joint
# review's own numbering. OC-0-N* were found while cataloguing grains for this
# milestone and are new.

[findings.OC-B3]
scope = "construct"
severity = "blocker"
origin = "joint review"
summary = "ORM primary keys contradict multi-row view grains, so SQLAlchemy's identity map collapses child-specific values."

[findings.OC-B4]
scope = "construct"
severity = "blocker"
origin = "joint review"
summary = "Demography postcode, country-of-birth, and language subqueries are unranked, producing an N x M x K product per person/episode."

[findings.OC-B5]
scope = "package"
severity = "blocker"
