# ===========================================================================
# Event family
# ===========================================================================
# Every construct in this family uses the canonical cross-table event identity
# and an explicit-first/all-in-window attachment policy. Valid explicit links
# match event ID, Field-concept discriminator, episode, and person; those events
# are anti-joined out of fallback. Unlinked events retain every eligible
# overlapping episode, and exact source-table/event/episode keys are distinct.
# OC-2 still owns the matching database indexes and ORM identities.

