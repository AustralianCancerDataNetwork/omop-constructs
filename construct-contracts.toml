[constructs.t_stage_mv]
class_name = "TStageMV"
module = "omop_constructs.alchemy.modifiers.modifier_mappers"
family = "modifiers"
grain = "One row per modified event: the preferred T stage for that event, earliest pathological if present, otherwise earliest clinical."
logical_key = ["person_id", "meas_event_field_concept_id", "measurement_event_id"]
logical_key_complete = true
key_nullable_columns = []
unique_index_columns = ["stage_id"]
orm_primary_key = ["stage_id"]
surrogate_kind = "source_identifier"
surrogate_stable_across_refresh = true
concurrent_refresh_eligible = true
concurrent_refresh_note = "stage_id is Measurement.measurement_id, unique and non-null, so it can back the required unique index directly."
public_api_1_0 = true
lung_report_role = "dependency"
oa_cohorts_rule_targets = []
inputs = [
  { name = "measurement", kind = "cdm_table", fan_out = "filter", note = "restricted to the tnm_t_stage concept set" },
  { name = "modifier_concept", kind = "vocabulary", fan_out = "many_to_one", note = "outer join; supplies stage_label and the p-prefix test" },
  { name = "row_number ranking", kind = "window", fan_out = "filter", note = "rn = 1 per (person_id, meas_event_field_concept_id, measurement_event_id) target partition" },
]
fan_out_note = "The ranking guarantees at most one row per person-scoped target identity, which is why the modifier views can be left-joined to Condition_Occurrence without multiplying it."

