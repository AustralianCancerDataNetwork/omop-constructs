  { name = "episode", kind = "cdm_table", fan_out = "one_to_many", note = "inner join on person_id only, restricted to episode_of_care; every one of the person's episodes is a candidate" },
  { name = "provider", kind = "cdm_table", fan_out = "inner_lookup", note = "drops visits with no provider" },
  { name = "provider_concept", kind = "vocabulary", fan_out = "inner_lookup", note = "drops visits whose provider specialty concept is absent" },
