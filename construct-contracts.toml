# Construct contracts
#
# The machine-readable D3 grain catalogue for every construct in the shipped
# registry. This file is the single source for the rendered construct
# catalogue, the registry coverage and key-column tests, and the release
# validation scripts under `scripts/release_validation/`.
#
# Why a manifest rather than attributes on the ORM classes: grain and logical
# key are intrinsic to a construct, but 1.0 inclusion and lung-report usage are
# release and catalogue concerns. Holding all of it here keeps release policy
# out of the runtime classes and gives documentation, tests, and the transition
# scripts one thing to read.
#
# Declared keys are the *intended* logical keys — the key each construct must
# satisfy to enter a 1.0 release candidate. Where a construct does not satisfy
# its declared key today, `known_violations` names the finding and
# `violation_note` says what is actually being produced. The uniqueness runner
# reports the real duplicate counts; it does not assume the declared key holds.

[meta]
schema_version = "1"
created = "2026-08-31"
milestone = "OC-0"
source_review = "joint-code-review-oa-cohorts-0a3efc9-omop-constructs-09497d4-omop-alchemy-3b5236b.md"
delivery_plan = "phased-delivery-plan-oa-cohorts-omop-constructs-omop-alchemy.md"
lung_report_library_id = "REP-000001"
lung_report_bundle = "dashboard-stack/oa-cohorts/dash_config/20260827_post_migration/bundle.json"

# Vocabularies used by the per-construct fields, so a reader does not have to
# infer the enumerations from the values that happen to appear below.
[meta.vocabulary]
fan_out = [
  "one_to_one",          # exactly one output row per input row
  "one_to_zero_or_one",  # at most one; an outer join that cannot multiply
  "one_to_many",         # multiplies output rows
  "many_to_one",         # a lookup; does not multiply
  "inner_lookup",        # a lookup that DROPS input rows when it misses
  "aggregate",           # collapses input rows to a coarser grain
  "filter",              # removes rows without multiplying
  "union_all",           # appends rows from a second stream
]
surrogate_kind = [
  "source_identifier",         # a CDM primary key carried through; stable
  "refresh_local_row_number",  # unordered row_number(); NOT stable
  "none",
]
lung_report_role = [
  "direct",      # a lung report measure resolves to this construct
  "dependency",  # built because a direct construct depends on it
  "unused",      # not reachable from the lung report
]

