# Construct contracts
#
# Grains, logical keys, ORM identities, join behaviour and refresh constraints
# for the registered constructs. This manifest supplies the public catalogue,
# registry consistency tests and schema comparison tools.
#
# Declared keys are contract requirements. current_grain and current_unique_on
# describe output that differs from those requirements. Measure uniqueness on
# the target schema; a declaration is not evidence that deployed rows satisfy it.

[meta]
schema_version = "1"

# Vocabularies used by the per-construct fields, so a reader does not have to
# infer the enumerations from the values that happen to appear below.
[meta.vocabulary]
fan_out = [
  "one_to_one",          # exactly one output row per input row
  "one_to_zero_or_one",  # at most one; an outer join that cannot multiply
  "one_to_many",         # multiplies output rows
  "many_to_one",         # a lookup; does not multiply
  "inner_lookup",        # a lookup that DROPS input rows when it misses
  "aggregate",           # collapses input rows to a coarser grain
  "filter",              # removes rows without multiplying
  "union_all",           # appends rows from a second stream
]
surrogate_kind = [
  "source_identifier",         # a CDM primary key carried through; stable
  "refresh_local_row_number",  # unordered row_number(); NOT stable
  "none",
]
lung_report_role = [
  "direct",      # a lung report measure resolves to this construct
  "dependency",  # built because a direct construct depends on it
  "unused",      # not reachable from the lung report
]

