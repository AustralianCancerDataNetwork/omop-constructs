summary = "Standard-concept mapping mislabels vocabulary_id and collapses one-to-many 'Maps to' relationships."

[findings.OC-M3]
scope = "construct"
severity = "medium"
origin = "joint review"
summary = "Public identifiers are frequently unordered row_number() surrogates: unique within one materialization, not stable across refreshes."

[findings.OC-M4]
scope = "package"
severity = "medium"
origin = "joint review"
summary = "Repeated mapper-registration warnings hide genuine mapping conflicts."

[findings.OC-0-N1]
scope = "construct"
severity = "high"
origin = "OC-0"
summary = "Modifier ranking partitions on measurement_event_id alone."
detail = """
`get_query_per_stage_type()` and `earliest_modifier()` both rank with
`row_number() OVER (PARTITION BY measurement_event_id ...)`. The partition omits
`meas_event_field_concept_id`, so two events in different OMOP tables that share
a numeric ID fall into one partition and only one survives. Worse, PARTITION BY
groups all NULLs together, so every modifier measurement with no
`measurement_event_id` collapses to a single surviving row across the whole
view. Affects t/n/m/group_stage_mv and the size, grade, laterality, and
metastatic-disease modifier views.
"""

[findings.OC-0-N2]
scope = "construct"
severity = "high"
origin = "OC-0"
summary = "cycle_mv inner-joins route_concept, silently dropping drug exposures with no resolvable route."
detail = """
`cycle_join` inner-joins both `drug_concept` and `route_concept`. A
Drug_Exposure whose `route_concept_id` is 0, NULL, or absent from the deployed
vocabulary is dropped from cycle_mv, and therefore from sact_treatment_mv,
condition_treatment_episode_mv, and the SACT window of treatment_envelope_mv.
Route is descriptive metadata; it should not gate SACT membership.
"""

[findings.OC-0-N3]
scope = "construct"
severity = "medium"
origin = "OC-0"
summary = "stage_modifier_mv inner-joins stage_concept onto a left-joined modifier, converting the modifier join to an inner join."
detail = """
`all_stage_join` left-joins AllStageModifierMV and then inner-joins
`stage_concept` on `AllStageModifierMV.measurement_concept_id`. The inner join
cannot match when the left join misses, so conditions with no stage modifier are
dropped even though the query is written as an outer join.
"""

[findings.OC-0-N4]
scope = "construct"
severity = "high"
origin = "OC-0"
summary = "episode_treatment_mv has no executable complete logical key: the intent measurement identity is not projected."
detail = """
`episode_intent` joins Episode to Measurement on the intent modifier, so the row
grain is (episode, intent measurement). Only `measurement_concept_id` is
projected, not `measurement_id`, so two intent measurements on one episode with
the same concept are indistinguishable in the output. The declared key
(treatment_episode_id, treatment_intent_concept_id) is the widest key expressible
from the current columns; OC-2 must project the measurement identity.
"""

[findings.OC-0-N5]
scope = "construct"
severity = "blocker"
origin = "OC-0"
summary = "rt_course_mv resolves the course episode with the treatment_regimen concept, not radiotherapy."
detail = """
`course_join` joins the course episode with
`Episode.episode_concept_id == treatment_episode_types.treatment_regimen`
(32531). omop-semantics also defines `treatment_episode_types.radiotherapy`
(32940). Unless RT courses are recorded in this CDM as treatment_regimen
episodes, the left join misses and course_number, condition_episode_id,
course_prescription_id, course_concept_id, course_concept, and every intent
field are NULL for real courses. A NULL condition_episode_id also removes RT
from the rt_window join in treatment_envelope_mv and from
condition_treatment_episode_mv. This must be confirmed against clinical data
before OC-1: if RT courses are not typed as regimens, radiotherapy is currently
absent from the treatment envelope.
"""

[findings.OC-0-N6]
scope = "construct"
severity = "medium"
origin = "OC-0"
summary = "condition_treatment_episode_mv regimen_count and course_count are always 1."
detail = """
`regimen_summary_join` computes `count(regimen_id)` while grouping by
`regimen_id`, and `course_summary_join` computes `count(course_id)` while
grouping by `course_id`. Each group therefore contains exactly one distinct
value and the count is 1 (or 0 when the id is NULL). oa-cohorts binds
`course_count` as the RT measurable's value_concept_attr, so the exposed value
carries no information.
"""

[findings.OC-0-N10]
scope = "package"
severity = "medium"
origin = "OC-0"
summary = "Compiled construct SQL is not reproducible: embedded concept-ID IN lists render in hash-seed-dependent set order."
detail = """
Constructs that embed a resolved concept set — the four per-stage-type modifier
views, the modifier views, fraction_mv, episode_treatment_mv, and every
concept-restricted measurement slice — pass a Python `set` to `.in_()`. SQLAlchemy
renders it in set-iteration order, which varies between processes, so the same
construct built twice by the same library version produces different SQL text and
a different checksum. PostgreSQL then preserves that order in
`pg_get_viewdef`, so the deployed definition is unstable too.

This defeats checksum-based release validation: roughly a quarter of the registry
reports as changed on every run. `scripts/release_validation/_sql_normalise.py`
works around it by sorting numeric IN lists before hashing, and the orchestrator
reports ordering-only differences separately from real ones. The underlying fix
is for the query factories to sort resolved concept IDs before rendering them,
which also makes deployed view definitions reviewable across rebuilds. Belongs
with the runtime-concept work in OC-3.
"""

[findings.OC-0-N9]
scope = "package"
severity = "medium"
origin = "OC-0"
summary = "ConstructRegistry.validate() reads information_schema.columns, which does not list materialized views."
detail = """
`validate()` compares the mapper's columns against
`information_schema.columns`. Materialized views are a PostgreSQL extension and
do not appear in the information schema at all, so the query returns no rows and
every construct is reported as missing all of its columns. The method therefore
cannot detect real schema drift. Column introspection must read `pg_attribute`,
as `scripts/release_validation/_common.py` now does. Fix belongs with the rest
of the lifecycle work in OC-3.
"""

[findings.OC-0-N8]
scope = "construct"
severity = "medium"
origin = "OC-0"
summary = "sact_treatment_mv and rt_course_mv read modified_procedure_mv without declaring it."
detail = """
Both `regimen_join` and `course_join` join ModifiedProcedure to resolve the
prescription procedure and its intent, but neither construct listed
modified_procedure_mv in `__deps__`. `__deps__` is what topo_sort uses to order
the build, so the correct order held only because the bootstrap manifest happens
to import the modifier family before the episode family. Any build driven by the
dependency graph alone — including the OC-0 side-schema runner — could create
either view before its input existed. Corrected in OC-0 by declaring the
dependency; no query or result changes.
"""

[findings.OC-0-N7]
scope = "construct"
severity = "low"
origin = "OC-0"
summary = "condition_treatment_episode_mv materialises four duplicate unmapped columns."
detail = """
`condition_treatment_join` splats both summary subqueries, so person_id and
condition_episode_id are each selected three times. The materialized view gains
person_id_1, condition_episode_id_1, person_id_2, and condition_episode_id_2,
which no mapper reads. compile_check only requires mapped columns to be a subset
of the selectable, so it does not surface this.
"""

