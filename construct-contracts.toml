public_api_1_0 = true
lung_report_role = "direct"
oa_cohorts_rule_targets = ["demog_death"]
inputs = [
  { name = "person", kind = "cdm_table", fan_out = "one_to_one", note = "spine" },
  { name = "condition_episode_mv", kind = "construct", fan_out = "one_to_many", note = "inner join on person_id; one row per episode, which is the intended grain" },
  { name = "death", kind = "cdm_table", fan_out = "one_to_zero_or_one", note = "outer join on person_id; Death is person-grain in OMOP" },
  { name = "concept (gender)", kind = "vocabulary", fan_out = "inner_lookup", note = "INNER join on gender_concept_id, so a person with a missing or zero gender concept is removed entirely" },
  { name = "observation (postcode)", kind = "cdm_table", fan_out = "one_to_many", note = "outer join, unranked; every postcode observation the person has multiplies" },
  { name = "observation (country of birth)", kind = "cdm_table", fan_out = "one_to_many", note = "outer join, unranked; multiplies independently" },
  { name = "observation (language spoken)", kind = "cdm_table", fan_out = "one_to_many", note = "outer join, unranked; multiplies independently" },
]
fan_out_note = "The three demographic observation joins are independent and unranked, so a person with N postcodes, M countries of birth, and K languages contributes N*M*K rows per episode. Postcode is read from a numeric observation value, so leading zeroes are not preserved."

