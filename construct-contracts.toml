# ===========================================================================
# Event family
# ===========================================================================
# Every construct in this family uses the canonical cross-table event identity
# and an explicit-first/ranked-fallback attachment policy. Valid explicit links
# match event ID, Field-concept discriminator, episode, and person; those events
# are anti-joined out of fallback. Unlinked events select one eligible episode
# deterministically, and exact source-table/event/episode keys are distinct.
# Logical keys and ORM identities are recorded independently of database indexes.

