name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  label-gate:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/label-gate.yml@main
  build-test-sqlite:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test.yml@main
    with:
      ty-src: src/omop_constructs
  build-test-postgres:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test-postgres-v2.yml@main
    with:
      ty-src: src/omop_constructs
      postgres-image: postgres:17
      postgres-db: omop_constructs_ci
      setup-commands: |
        uv run omop-config connections add ci_pg \
          --dialect postgresql+psycopg \
          --host localhost \
          --port 5432 \
          --user test \
          --password test \
          --database-name omop_constructs_ci \
          --test-only false
        uv run omop-config connections add ci_pg_test \
          --dialect postgresql+psycopg \
          --host localhost \
          --port 5432 \
          --user test \
          --password test \
          --database-name omop_constructs_test_ci \
          --test-only true
        uv run omop-config databases add cdm cdm_db \
          --connection ci_pg \
          --cdm-schema public
        uv run omop-config databases add cdm test_cdm_db \
          --connection ci_pg_test \
          --cdm-schema public \
          --vocab-schema public
        uv run omop-config configure omop_alchemy \
          --test-cdm-db-pg test_cdm_db
